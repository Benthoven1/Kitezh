<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>document.documentElement.classList.add('ls-instant-cover');</script>
  <title>Contact Us &mdash; Mulvium</title>
  <link rel="stylesheet" href="../../css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Cormorant+SC:wght@400;500&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,900;1,300;1,400&family=Great+Vibes&family=Inter:wght@300;400;500;600&family=Italiana&family=Pinyon+Script&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
</head>
<body style="opacity:0" class="contact-page">
  <div id="nav-cap" aria-hidden="true"></div>
  <nav class="navbar visible" aria-hidden="false">
    <div class="nav-brand">
      <a href="../../index.html" id="brand-link"><span class="bl bl-1">M</span><span class="bl bl-2">U</span><span class="bl bl-3">L</span><span class="bl bl-4">V</span><span class="bl bl-5">i</span><span class="bl bl-6">u</span><span class="bl bl-7">M</span></a>
    </div>
    <button class="nav-burger" aria-label="Open menu" aria-expanded="false">
      <span></span><span></span>
    </button>
    <ul class="nav-links">
      <li class="nav-item">
        <a href="../../index.html" class="nav-trigger">Home</a>
      </li>
      <li class="nav-item has-dropdown">
        <button class="nav-trigger" aria-haspopup="true" aria-expanded="false">Offerings</button>
        <ul class="dropdown">
          <li><a href="../../index.html#ifo">International Festival Orchestra</a></li>
          <li><a href="../../pages/meet-mulvium/meaning-of-mulvium.html">Meaning of Mulvium</a></li>
        </ul>
      </li>
      <li class="nav-item has-dropdown">
        <button class="nav-trigger" aria-haspopup="true" aria-expanded="false">About Us</button>
        <ul class="dropdown">
          <li><a href="../../pages/about/people.html">People</a></li>
          <li><a href="../../pages/about/careers.html">Careers</a></li>
          <li><a href="../../pages/about/contact.html">Contact Us</a></li>
        </ul>
      </li>
    </ul>
  </nav>

  <!-- Mesh network — the five cosmos spheres as graph nodes; new nodes
       join the network as each field is completed -->
  <canvas id="mesh-bg" aria-hidden="true"></canvas>

  <main class="contact-shell">
    <header class="contact-head">
      <p class="contact-eyebrow">About</p>
      <h1 class="contact-title">Contact Us</h1>
      <p class="contact-sub">Inquiries, partnerships, and press.</p>
    </header>

    <section id="card-section">
      <div class="card" id="card">
        <div class="card-page card-page--left">
          <p class="ci-salutation">Dear Mulvium,</p>
          <div class="ci-field ci-field--fill">
            <textarea class="ci-input ci-textarea" id="ci-message" aria-label="Message"></textarea>
          </div>
        </div>
        <div class="card-spine" aria-hidden="true"></div>
        <div class="card-page card-page--right">
          <form id="card-form" class="card-form" novalidate>
            <div class="ci-field">
              <label class="ci-label" for="ci-name">Name</label>
              <input class="ci-input" id="ci-name" name="name" type="text" autocomplete="name" />
            </div>
            <div class="ci-field">
              <label class="ci-label" for="ci-email">Email</label>
              <input class="ci-input" id="ci-email" name="email" type="email" autocomplete="email" />
            </div>
            <div class="ci-field">
              <label class="ci-label" for="ci-interest">Subject</label>
              <select class="ci-input ci-select" id="ci-interest" name="interest">
                <option value="" selected disabled hidden></option>
                <option>Patronage</option>
                <option>International Festival Orchestra</option>
                <option>Partnership</option>
                <option>Press</option>
                <option>Other</option>
              </select>
            </div>
            <div class="ci-actions">
              <button class="ci-submit" type="submit"><span>Send</span><span class="ci-arrow">&rarr;</span></button>
            </div>
          </form>
          <div class="ci-success" id="ci-success" role="status">
            <div class="ci-success-icon">&#10022;</div>
            <p class="ci-success-title">Message sent</p>
            <p class="ci-success-msg">We will respond shortly.</p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer id="site-footer">
    <div class="footer-copy">
      <p>&copy; <span id="year"></span> Mulvium Foundation. All rights reserved.</p>
    </div>
  </footer>

  <!-- Loading screen — nested image frames reveal the network beneath -->
  <div id="loading-screen" aria-hidden="true">
    <div id="ls-f1" class="ls-frame"><div class="ls-img"></div></div>
    <div id="ls-f2" class="ls-frame"><div class="ls-img"></div></div>
    <div id="ls-f3" class="ls-frame"><div class="ls-img"></div></div>
    <div id="ls-f4" class="ls-frame"><div class="ls-img"></div></div>
    <div id="ls-border" class="ls-frame"></div>
  </div>

  <script src="../../js/ls.js"></script>
  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.161.0/build/three.module.js" } }
  </script>
  <script type="module" src="../../js/contact-mesh.js"></script>
  <script src="../../js/cursor.js" defer></script>
  <script src="../../js/nav.js"></script>
  <script src="../../js/page-transition.js"></script>
  <script src="../../js/card.js" defer></script>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
